[package]
name = "sleekmeeter"
version = "0.10.0"
description = "A modern face for Voicemeeter Banana"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
ureq = "2"
# Link to OBS Studio (its WebSocket server): sockets and the sign-in proof.
tungstenite = "0.24"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Per-app volume talks to Windows' audio sessions (COM), which windows-sys has no types for.
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio", "Win32_UI_Controls_Dialogs", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

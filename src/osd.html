<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sleekmeeter overlay</title>
  <style>
    @font-face { font-family: "Saira SC"; src: url("fonts/SairaSemiCondensed-SemiBold.woff") format("woff"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Saira SC"; src: url("fonts/SairaSemiCondensed-Bold.woff") format("woff"); font-weight: 700; font-display: block; }
    /* Matches the mixer's theme (data-theme on body); Console is the default */
    :root {
      --mod-a: #202027; --mod-b: #18181d; --edge: rgba(255,255,255,.07); --line: #2a2a31; --ink: #eeedf2; --muted: #7f7e89;
      --well: #070709; --red: #ff5a5a; --glow: 1;
      --c-slate: #a3a2ad; --c-amber: #f2b443; --c-coral: #f58a5c; --c-rose: #f46b9c;
      --c-violet: #a58cff; --c-blue: #6ea0ff; --c-cyan: #46c6ec; --c-green: #49d17d;
      color-scheme: dark;
    }
    body { --key: #25252c; }
    body[data-theme="glass"] { --mod-a: #35486bf2; --mod-b: #171e38f5; --edge: #eef9ff65; --line: #e8f6ff29; --ink: #f6f7ff; --muted: #b3bdd9; --well: #0913298c; --red: #ff6b8a; --key: #eef9ff21; }
    body[data-theme="neon"] { --mod-a: #0d0a1c; --mod-b: #0a0716; --edge: transparent; --line: #ff2e97; --ink: #f4eeff; --muted: #8573b8; --well: #05030b; --red: #ff3860; --key: #130f26; --glow: 1.5; }
    body[data-theme="terminal"] { --mod-a: #04120a; --mod-b: #04120a; --edge: transparent; --line: #0f4a22; --ink: #8dffa8; --muted: #38924f; --well: #010603; --red: #ff5f56; --key: #04120a; --glow: .7; }
    body[data-theme="bubblegum"] { --mod-a: #ffffff; --mod-b: #fff4f9; --edge: #fff; --line: #ffc2de; --ink: #5a1d41; --muted: #a2567b; --well: #ffd3e6; --red: #bd235b; --key: #ffe0ee; --glow: .5; color-scheme: light; }
    body[data-theme="block"] { --mod-a: #fff; --mod-b: #fff; --edge: transparent; --line: #111; --ink: #111; --muted: #5a5646; --well: #eee7d2; --red: #b82340; --key: #fff4c9; --glow: 0; color-scheme: light; }
    body[data-theme="arcade"] { --mod-a: #2a1260; --mod-b: #2a1260; --edge: transparent; --line: #ffffff; --ink: #ffffff; --muted: #9a85d8; --well: #0a0420; --red: #ff3b3b; --key: #170a35; --glow: .4; }
    body[data-theme="peach"] { --mod-a: #fffaf6; --mod-b: #fff1ea; --edge: #fff; --line: #ffcabb; --ink: #6b2a3a; --muted: #995764; --well: #ffdcd0; --red: #a82d4f; --key: #ffe3d9; --glow: .5; color-scheme: light; }
    body[data-theme="sticker"] { --mod-a: #fff3a8; --mod-b: #fff3a8; --edge: transparent; --line: #1a1a1a; --ink: #1a1a1a; --muted: #6b6354; --well: #fff; --red: #a8272c; --key: #fff; --glow: 0; color-scheme: light; }
    body[data-theme="oled"] { --mod-a: #000; --mod-b: #000; --edge: transparent; --line: #1f1f24; --well: #000; --glow: .6; --key: #000; }
    body[data-theme="hyrule"] { --mod-a: #234737; --mod-b: #112d23; --edge: #897046; --line: #897046; --ink: #f7ebce; --muted: #aebfa9; --well: #081912; --key: #2c463b; --red: #ff887d; --c-amber: #e6c573; --c-blue: #83baff; }
    body[data-theme="hadal"] { --mod-a: #164c65; --mod-b: #0a2039; --edge: #63e6e0; --line: #407b96; --ink: #e9fcff; --muted: #a1cddb; --well: #06182b; --key: #11394f; --red: #ff9fae; --c-blue: #84b6ff; --c-cyan: #3df1e3; }
    [data-color="slate"] { --acc: var(--c-slate); } [data-color="amber"] { --acc: var(--c-amber); }
    [data-color="coral"] { --acc: var(--c-coral); } [data-color="rose"] { --acc: var(--c-rose); }
    [data-color="violet"] { --acc: var(--c-violet); } [data-color="blue"] { --acc: var(--c-blue); }
    [data-color="cyan"] { --acc: var(--c-cyan); } [data-color="green"] { --acc: var(--c-green); }
    [data-color="lemon"] { --acc: #ffe46c; } [data-color="lime"] { --acc: #b8e866; }
    [data-color="mint"] { --acc: #9af3cd; } [data-color="teal"] { --acc: #28c1b2; }
    [data-color="indigo"] { --acc: #8e94ff; } [data-color="magenta"] { --acc: #ed71f7; }
    [data-color="ruby"] { --acc: #fa616c; } [data-color="copper"] { --acc: #cb996f; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { --acc: var(--c-slate); font-family: "Saira SC", "Segoe UI", system-ui, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; user-select: none; letter-spacing: .01em; }
    .card {
      position: absolute; inset: 4px; border-radius: 12px; background: linear-gradient(180deg, var(--mod-a), var(--mod-b));
      box-shadow: inset 0 1px 0 var(--edge), 0 0 0 1px var(--line);
      display: grid; grid-template-columns: 40px 1fr auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 7px;
      align-items: center; padding: 10px 16px 12px 12px;
      animation: pop .22s cubic-bezier(.2, 1.3, .4, 1);
    }
    @keyframes pop { from { transform: scale(.94) translateY(4px); opacity: 0; } }
    .chip {
      grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; color: var(--acc);
      background: color-mix(in srgb, var(--acc) 15%, var(--key)); box-shadow: 0 0 calc(14px * var(--glow)) color-mix(in srgb, var(--acc) 25%, transparent);
    }
    .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .value { font-size: 18px; font-weight: 700; }
    .bar {
      grid-column: 2 / 4; height: 8px; border-radius: 3px; background: var(--well); position: relative; overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.9);
      -webkit-mask: repeating-linear-gradient(to right, #000 0 4px, transparent 4px 6px); mask: repeating-linear-gradient(to right, #000 0 4px, transparent 4px 6px);
    }
    .fill { position: absolute; inset: 0; transform-origin: left; background: var(--acc); transition: transform .14s cubic-bezier(.2, .9, .3, 1), background-color .2s; will-change: transform; }
    .muted .fill { background: var(--muted); }
    .muted .value { color: var(--red); }
    body[data-theme="glass"] .card { border-radius: 22px; }
    body:is([data-theme="bubblegum"], [data-theme="peach"], [data-theme="hadal"]) .card { border-radius: 18px; }
    body:is([data-theme="glass"], [data-theme="bubblegum"], [data-theme="hadal"]) .chip { border-radius: 50%; }
    body:is([data-theme="glass"], [data-theme="hadal"]) .bar {
      -webkit-mask: none; mask: none; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line);
    }
    body:is([data-theme="terminal"], [data-theme="block"], [data-theme="arcade"]) :is(.card, .chip, .bar) { border-radius: 0; }
    body[data-theme="terminal"] { font-family: Consolas, monospace; }
    body:is([data-theme="block"], [data-theme="sticker"]) .card { box-shadow: 0 0 0 1px var(--line), 2px 2px var(--line); }
    body:is([data-theme="block"], [data-theme="sticker"], [data-theme="bubblegum"], [data-theme="peach"]) .chip { color: color-mix(in srgb, var(--ink) 68%, var(--acc)); }
    body:is([data-theme="block"], [data-theme="sticker"], [data-theme="bubblegum"], [data-theme="peach"]) .card:not(.muted) .fill { background: color-mix(in srgb, var(--acc) 58%, var(--ink)); }
    /* Finishing touches: each theme's signature light or edge */
    body[data-theme="neon"] .card { box-shadow: 0 0 0 1px var(--line), 0 0 18px #ff2e9759, inset 0 0 22px #ff2e971f; }
    body[data-theme="neon"] .value { color: var(--acc); text-shadow: 0 0 10px var(--acc); }
    body[data-theme="hadal"] .card { box-shadow: inset 0 1px 0 #ffffff33, 0 0 0 1px var(--line), 0 0 16px #3df1e326; }
    body[data-theme="hyrule"] .card { border-radius: 5px; box-shadow: inset 0 0 0 1px #897046, inset 0 0 0 4px #152d24, inset 0 0 0 5px #9b794d60; }
    body[data-theme="hyrule"] .value { color: #e6c573; }
    body[data-theme="terminal"] :is(.name, .value) { text-shadow: 0 0 6px #3dff7a66; }
    body[data-theme="arcade"] .card { box-shadow: 0 0 0 3px #fff; }
    body[data-theme="arcade"] .value { color: #ffd400; text-shadow: 2px 2px 0 #ff3b3b; }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } .fill { transition: none; } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <span class="chip" id="chip"></span>
    <span class="name" id="name"></span>
    <span class="value" id="value"></span>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <script src="icons.js"></script>
  <script src="osd.js"></script>
</body>
</html>

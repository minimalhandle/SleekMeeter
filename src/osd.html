<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sleekmeeter overlay</title>
  <style>
    @font-face { font-family: "Saira SC"; src: url("fonts/SairaSemiCondensed-SemiBold.woff") format("woff"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Saira SC"; src: url("fonts/SairaSemiCondensed-Bold.woff") format("woff"); font-weight: 700; font-display: block; }
    /* Matches the mixer's theme (data-theme on body); Console is the default */
    :root {
      --mod-a: #202027; --mod-b: #18181d; --edge: rgba(255,255,255,.07); --line: #2a2a31; --ink: #eeedf2; --muted: #7f7e89;
      --well: #070709; --red: #ff5a5a; --glow: 1;
      --c-slate: #a3a2ad; --c-amber: #f2b443; --c-coral: #f58a5c; --c-rose: #f46b9c;
      --c-violet: #a58cff; --c-blue: #6ea0ff; --c-cyan: #46c6ec; --c-green: #49d17d;
      color-scheme: dark;
    }
    body { --key: #25252c; }
    body[data-theme="analog"] { --mod-a: #2c2219; --mod-b: #221a13; --edge: rgba(255,225,190,.08); --line: #3c3026; --ink: #f4e9d6; --muted: #8f7e68; --well: #0a0705; --red: #ff5c47; --key: #30261d; }
    body[data-theme="studio"] { --mod-a: #fcfbf9; --mod-b: #f2f0ec; --edge: #fff; --line: #d3cfc8; --ink: #1c1b21; --muted: #85838d; --well: #1b1b20; --red: #e5484d; --key: #e8e5e0; --glow: .45; color-scheme: light; }
    body[data-theme="glass"] { --mod-a: rgba(40,44,90,.9); --mod-b: rgba(30,34,72,.9); --edge: rgba(255,255,255,.22); --line: rgba(255,255,255,.2); --ink: #f6f7ff; --muted: #959ac4; --well: rgba(10,12,32,.5); --red: #ff6b8a; --key: rgba(255,255,255,.12); }
    body[data-theme="ink"] { --mod-a: #fffdf8; --mod-b: #fffdf8; --edge: transparent; --line: #ddd7c9; --ink: #1c1a16; --muted: #948e80; --well: rgba(30,26,20,.12); --red: #d62f2f; --key: #ece7da; --glow: 0; color-scheme: light; }
    body[data-theme="neon"] { --mod-a: #0d0a1c; --mod-b: #0a0716; --edge: transparent; --line: #ff2e97; --ink: #f4eeff; --muted: #8573b8; --well: #05030b; --red: #ff3860; --key: #130f26; --glow: 1.5; }
    body[data-theme="terminal"] { --mod-a: #04120a; --mod-b: #04120a; --edge: transparent; --line: #0f4a22; --ink: #8dffa8; --muted: #38924f; --well: #010603; --red: #ff5f56; --key: #04120a; --glow: .7; }
    body[data-theme="bubblegum"] { --mod-a: #ffffff; --mod-b: #fff4f9; --edge: #fff; --line: #ffc2de; --ink: #5a1d41; --muted: #c0749c; --well: #ffd3e6; --red: #ff3d7f; --key: #ffe0ee; --glow: .5; color-scheme: light; }
    body[data-theme="blueprint"] { --mod-a: #0d3d78; --mod-b: #0b3366; --edge: transparent; --line: rgba(190,220,255,.6); --ink: #eef6ff; --muted: #86b0de; --well: rgba(4,22,52,.6); --red: #ff8a8a; --key: #0b3366; --glow: .25; }
    body[data-theme="block"] { --mod-a: #fff; --mod-b: #fff; --edge: transparent; --line: #111; --ink: #111; --muted: #5a5646; --well: #111; --red: #ff3d5a; --key: #fff4c9; --glow: 0; color-scheme: light; }
    body[data-theme="oled"] { --mod-a: #000; --mod-b: #000; --edge: transparent; --line: #1f1f24; --well: #000; --glow: .6; --key: #000; }
    [data-color="slate"] { --acc: var(--c-slate); } [data-color="amber"] { --acc: var(--c-amber); }
    [data-color="coral"] { --acc: var(--c-coral); } [data-color="rose"] { --acc: var(--c-rose); }
    [data-color="violet"] { --acc: var(--c-violet); } [data-color="blue"] { --acc: var(--c-blue); }
    [data-color="cyan"] { --acc: var(--c-cyan); } [data-color="green"] { --acc: var(--c-green); }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { --acc: var(--c-slate); font-family: "Saira SC", "Segoe UI", system-ui, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; user-select: none; letter-spacing: .01em; }
    .card {
      position: absolute; inset: 4px; border-radius: 12px; background: linear-gradient(180deg, var(--mod-a), var(--mod-b));
      box-shadow: inset 0 1px 0 var(--edge), 0 0 0 1px var(--line);
      display: grid; grid-template-columns: 40px 1fr auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 7px;
      align-items: center; padding: 10px 16px 12px 12px;
      animation: pop .14s ease-out;
    }
    @keyframes pop { from { transform: scale(.96); opacity: 0; } }
    .chip {
      grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; color: var(--acc);
      background: color-mix(in srgb, var(--acc) 15%, var(--key)); box-shadow: 0 0 calc(14px * var(--glow)) color-mix(in srgb, var(--acc) 25%, transparent);
    }
    .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .value { font-size: 18px; font-weight: 700; }
    .bar {
      grid-column: 2 / 4; height: 8px; border-radius: 3px; background: var(--well); position: relative; overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.9);
      -webkit-mask: repeating-linear-gradient(to right, #000 0 4px, transparent 4px 6px); mask: repeating-linear-gradient(to right, #000 0 4px, transparent 4px 6px);
    }
    .fill { position: absolute; inset: 0; transform-origin: left; background: var(--acc); transition: transform .12s ease-out; will-change: transform; }
    .muted .fill { background: var(--muted); }
    .muted .value { color: var(--red); }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } .fill { transition: none; } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <span class="chip" id="chip"></span>
    <span class="name" id="name"></span>
    <span class="value" id="value"></span>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <script src="icons.js"></script>
  <script src="osd.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sleekmeeter overlay</title>
  <style>
    @font-face { font-family: "Saira SC"; src: url("fonts/SairaSemiCondensed-SemiBold.woff") format("woff"); font-weight: 600; font-display: block; }
    @font-face { font-family: "Saira SC"; src: url("fonts/SairaSemiCondensed-Bold.woff") format("woff"); font-weight: 700; font-display: block; }
    @font-face { font-family: "Rajdhani"; src: url("fonts/Rajdhani-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
    @font-face { font-family: "Orbitron"; src: url("fonts/Orbitron-600.woff2") format("woff2"); font-weight: 600; font-display: block; }
    /* Matches the mixer's theme (data-theme on body); Graphite is the default */
    :root {
      --mod-a: #202027; --mod-b: #18181d; --edge: rgba(255,255,255,.07); --line: #2a2a31; --ink: #eeedf2; --muted: #7f7e89;
      --well: #070709; --red: #ff5a5a; --glow: 1;
      --c-slate: #a3a2ad; --c-amber: #f2b443; --c-coral: #f58a5c; --c-rose: #f46b9c;
      --c-violet: #a58cff; --c-blue: #6ea0ff; --c-cyan: #46c6ec; --c-green: #49d17d;
      color-scheme: dark;
    }
    body { --key: #25252c; }
    body[data-theme="glass"] { --mod-a: #4a2fa8f0; --mod-b: #1a1446f5; --edge: #ffffffb0; --line: #ffffff40; --ink: #ffffff; --muted: #d9d4ff; --well: #00000040; --red: #ff4f7a; --key: #ffffff26; --c-amber: #ffb36b; --c-violet: #b18bff; --c-green: #3dffb0; --c-cyan: #7cf3ff; --c-rose: #ff7ad9; }
    body[data-theme="groovy"] { --mod-a: #4a2a1a; --mod-b: #331c11; --edge: #e0a52699; --line: #5a3a22; --ink: #f6e3bf; --muted: #c9a678; --well: #1e0f09; --red: #c4332a; --key: #2b1810; --glow: .4; --c-amber: #e0a526; --c-coral: #e8702a; --c-green: #8a9a3a; --c-rose: #e2627a; }
    body[data-theme="transit"] { --mod-a: #ffffff; --mod-b: #ffffff; --edge: transparent; --line: #d0cdc5; --ink: #1b1b1b; --muted: #6b6a66; --well: #e6e4de; --red: #d62d20; --key: #efeee9; --glow: 0; color-scheme: light; --c-amber: #f2a900; --c-coral: #e8502e; --c-blue: #0a7ad1; --c-green: #00985f; --c-violet: #8e4fc2; }
    body[data-theme="neon"] { --mod-a: #0d0a1c; --mod-b: #0a0716; --edge: transparent; --line: #ff2e97; --ink: #f4eeff; --muted: #8573b8; --well: #05030b; --red: #ff3860; --key: #130f26; --glow: 1.5; }
    body[data-theme="terminal"] { --mod-a: #04120a; --mod-b: #04120a; --edge: transparent; --line: #0f4a22; --ink: #8dffa8; --muted: #38924f; --well: #010603; --red: #ff5f56; --key: #04120a; --glow: .7; }
    body[data-theme="bubblegum"] { --mod-a: #ffffff; --mod-b: #fff4f9; --edge: #fff; --line: #ffc2de; --ink: #5a1d41; --muted: #a2567b; --well: #ffd3e6; --red: #bd235b; --key: #ffe0ee; --glow: .5; color-scheme: light; }
    body[data-theme="block"] { --mod-a: #fff; --mod-b: #fff; --edge: transparent; --line: #111; --ink: #111; --muted: #5a5646; --well: #eee7d2; --red: #b82340; --key: #fff4c9; --glow: 0; color-scheme: light; }
    body[data-theme="arcade"] { --mod-a: #2a1260; --mod-b: #2a1260; --edge: transparent; --line: #ffffff; --ink: #ffffff; --muted: #9a85d8; --well: #0a0420; --red: #ff3b3b; --key: #170a35; --glow: .4; }
    body[data-theme="oled"] { --mod-a: #000; --mod-b: #000; --edge: transparent; --line: #1f1f24; --well: #000; --glow: .6; --key: #000; }
    body[data-theme="overclock"] { --mod-a: #14161d; --mod-b: #0e1015; --edge: transparent; --line: #262a36; --ink: #eef1f7; --muted: #8b93a7; --well: #0a0b10; --key: #1c2029; --red: #ff3b5c; --glow: .8; --c-violet: #7b5cff; --c-cyan: #00e5ff; --c-green: #2bff9a; --c-rose: #ff2bd6; }
    body[data-theme="watercolour"] { --mod-a: #fffdf8; --mod-b: #f8f2e6; --edge: #ffffff; --line: #2b2833a6; --ink: #2b2833; --muted: #665f72; --well: #2b28330f; --red: #b8334a; --key: #f1eadc; --glow: 0; --c-slate: #6f7f91; --c-amber: #d9962a; --c-coral: #df6a4e; --c-rose: #d1495b; --c-violet: #7b5ea7; --c-blue: #30638e; --c-cyan: #00798c; --c-green: #6a994e; color-scheme: light; }
    body[data-theme="graphite"] { --mod-a: #2b2f36; --mod-b: #191c20; --edge: #ffffff26; --line: #2a2e35; --ink: #e9eef3; --muted: #7f8a96; --well: #07080a; --red: #ff5470; --key: #252930; --glow: .9; --c-amber: #ffc23f; --c-cyan: #3fe0ff; --c-green: #2bff9e; --c-violet: #9d85ff; --c-blue: #4d9bff; --c-rose: #ff5c9a; }
    body[data-theme="halo"] { --mod-a: #15151ef5; --mod-b: #0b0b11f7; --edge: #ffffff1f; --line: #ffffff17; --ink: #f3f2fa; --muted: #8e8ca3; --well: #ffffff0a; --red: #ff5d86; --key: #ffffff0d; --glow: .8; --c-slate: #b9b8cc; --c-amber: #ffc98a; --c-coral: #ff9a8a; --c-rose: #ff8ac0; --c-violet: #b6a8ff; --c-blue: #8fb4ff; --c-cyan: #9fd8ff; --c-green: #8ff0c4; }
    body[data-theme="abyss"] { --mod-a: #0c2133f5; --mod-b: #040b14f7; --edge: #7fe9ff26; --line: #7fe9ff17; --ink: #e3f6ff; --muted: #6f8ea3; --well: #01060c; --red: #ff5f7e; --key: #0b1d2e; --glow: 1; --c-slate: #9db6c8; --c-amber: #ffcf6e; --c-coral: #ff8a6e; --c-rose: #ff7fc8; --c-violet: #a68bff; --c-blue: #5fa8ff; --c-cyan: #3ff2d6; --c-green: #8bff9e; }
    body[data-theme="nordic"] { --mod-a: #71807a; --mod-b: #4b5853; --edge: #ffffff2e; --line: #5d6a65; --ink: #f5f2ec; --muted: #cdd6d1; --well: #3c4743; --red: #e58a5e; --key: #5d6a65; --glow: .3; --c-slate: #a6b3ae; --c-amber: #e8b35c; --c-coral: #e58a5e; --c-rose: #e48aa0; --c-violet: #b3a1dc; --c-blue: #8fb1d9; --c-cyan: #8ccaca; --c-green: #a9cc9a; }
    [data-color="slate"] { --acc: var(--c-slate); } [data-color="amber"] { --acc: var(--c-amber); }
    [data-color="coral"] { --acc: var(--c-coral); } [data-color="rose"] { --acc: var(--c-rose); }
    [data-color="violet"] { --acc: var(--c-violet); } [data-color="blue"] { --acc: var(--c-blue); }
    [data-color="cyan"] { --acc: var(--c-cyan); } [data-color="green"] { --acc: var(--c-green); }
    [data-color="lemon"] { --acc: #ffe46c; } [data-color="lime"] { --acc: #b8e866; }
    [data-color="mint"] { --acc: #9af3cd; } [data-color="teal"] { --acc: #28c1b2; }
    [data-color="indigo"] { --acc: #8e94ff; } [data-color="magenta"] { --acc: #ed71f7; }
    [data-color="ruby"] { --acc: #fa616c; } [data-color="copper"] { --acc: #cb996f; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { --acc: var(--c-slate); font-family: "Saira SC", "Segoe UI", system-ui, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; user-select: none; letter-spacing: .01em; }
    .card {
      position: absolute; inset: 4px; border-radius: 12px; background: linear-gradient(180deg, var(--mod-a), var(--mod-b));
      box-shadow: inset 0 1px 0 var(--edge), 0 0 0 1px var(--line);
      display: grid; grid-template-columns: 40px 1fr auto; grid-template-rows: auto auto; column-gap: 12px; row-gap: 7px;
      align-items: center; padding: 10px 16px 12px 12px;
      animation: pop .22s cubic-bezier(.2, 1.3, .4, 1);
    }
    @keyframes pop { from { transform: scale(.94) translateY(4px); opacity: 0; } }
    .chip {
      grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; color: var(--acc);
      background: color-mix(in srgb, var(--acc) 15%, var(--key)); box-shadow: 0 0 calc(14px * var(--glow)) color-mix(in srgb, var(--acc) 25%, transparent);
    }
    .name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .value { font-size: 18px; font-weight: 700; }
    .bar {
      grid-column: 2 / 4; height: 8px; border-radius: 3px; background: var(--well); position: relative; overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.9);
      -webkit-mask: repeating-linear-gradient(to right, #000 0 4px, transparent 4px 6px); mask: repeating-linear-gradient(to right, #000 0 4px, transparent 4px 6px);
    }
    .fill { position: absolute; inset: 0; transform-origin: left; background: var(--acc); transition: transform .14s cubic-bezier(.2, .9, .3, 1), background-color .2s; will-change: transform; }
    .muted .fill { background: var(--muted); }
    .muted .value { color: var(--red); }
    body[data-theme="glass"] .card { border-radius: 22px; }
    body:is([data-theme="halo"], [data-theme="nordic"]) .card { border-radius: 18px; }
    body[data-theme="graphite"] .card { border-radius: 14px; box-shadow: inset 0 1px 0 #ffffff29, 0 0 0 1px #07080a, 0 10px 20px #000a; }
    body[data-theme="halo"] .card { background: linear-gradient(180deg, #15151ef5, #0b0b11f7); box-shadow: inset 0 1px 0 #ffffff1f, 0 0 0 1px #b6a8ff26, 0 0 24px #b6a8ff26; }
    body[data-theme="abyss"] .card { border-radius: 18px; background: radial-gradient(90% 60% at 0% 0%, color-mix(in srgb, var(--acc) 14%, transparent), transparent 70%), linear-gradient(180deg, #0c2133f5, #040b14f7); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--acc) 55%, transparent), 0 0 0 1px #7fe9ff1a, 0 0 24px #3ff2d61f; }
    body[data-theme="abyss"] .chip { border-radius: 50%; color: color-mix(in srgb, var(--acc) 70%, #fff); background: radial-gradient(circle, color-mix(in srgb, var(--acc) 30%, #04101c), #04101c 72%); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 45%, transparent), 0 0 14px color-mix(in srgb, var(--acc) 35%, transparent); }
    body[data-theme="abyss"] .value { font-family: "IBM Plex Mono", Consolas, monospace; font-weight: 600; text-shadow: 0 0 12px color-mix(in srgb, var(--acc) 45%, transparent); }
    body[data-theme="abyss"] .bar { border-radius: 4px; -webkit-mask: repeating-linear-gradient(to right, #000 0 3px, #0006 3px 4px); mask: repeating-linear-gradient(to right, #000 0 3px, #0006 3px 4px); }
    body[data-theme="abyss"] .card:not(.muted) .fill { background: linear-gradient(90deg, #0a6f8a, #1fb8c9 40%, #3ff2d6 80%, #e6fffb); }
    body[data-theme="watercolour"] .card { border-radius: 16px 11px 18px 12px / 12px 18px 11px 16px; background: radial-gradient(70% 90% at 12% 30%, color-mix(in srgb, var(--acc) 24%, transparent), transparent 72%), radial-gradient(60% 80% at 90% 110%, color-mix(in srgb, var(--acc) 14%, transparent), transparent 70%), linear-gradient(180deg, #fffdf8, #f8f2e6); box-shadow: inset 0 0 0 1.2px #2b2833a6, 0 8px 18px #4a3c2826; }
    body[data-theme="watercolour"] .chip { border-radius: 46% 54% 52% 48% / 55% 45% 55% 45%; color: color-mix(in srgb, var(--acc) 62%, #1f1c26); background: radial-gradient(circle at 45% 40%, color-mix(in srgb, var(--acc) 22%, #fffdf8), color-mix(in srgb, var(--acc) 38%, #fffdf8) 80%); box-shadow: inset 0 0 0 1.2px #2b283380; }
    body[data-theme="watercolour"] :is(.name, .value) { font-family: "Sitka Banner", "Sitka Text", Georgia, serif; font-style: italic; font-weight: 700; }
    body[data-theme="watercolour"] .value { font-size: 20px; }
    body[data-theme="watercolour"] .muted .fill { background: #b9b3bf; }
    body[data-theme="watercolour"] .bar { border-radius: 4px; background: #2b28330f; box-shadow: inset 0 0 0 1px #2b283333; -webkit-mask: none; mask: none; }
    body[data-theme="watercolour"] .card:not(.muted) .fill { background: linear-gradient(90deg, color-mix(in srgb, var(--acc) 40%, #fffdf8), var(--acc) 92%, color-mix(in srgb, var(--acc) 70%, #1f1c26)); }
    body[data-theme="bubblegum"] .card { border-radius: 18px; }
    body:is([data-theme="glass"], [data-theme="bubblegum"]) .chip { border-radius: 50%; }
    body:is([data-theme="glass"]) .bar {
      -webkit-mask: none; mask: none; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line);
    }
    body:is([data-theme="terminal"], [data-theme="block"], [data-theme="arcade"]) :is(.card, .chip, .bar) { border-radius: 0; }
    body[data-theme="terminal"] { font-family: Consolas, monospace; }
    body:is([data-theme="block"]) .card { box-shadow: 0 0 0 1px var(--line), 2px 2px var(--line); }
    body:is([data-theme="block"], [data-theme="bubblegum"]) .chip { color: color-mix(in srgb, var(--ink) 68%, var(--acc)); }
    body:is([data-theme="block"], [data-theme="bubblegum"]) .card:not(.muted) .fill { background: color-mix(in srgb, var(--acc) 58%, var(--ink)); }
    /* Finishing touches: each theme's signature light or edge */
    /* Neon: a little sign with a glass tube round it, tube lettering and a pink-violet-cyan bar */
    body[data-theme="neon"] .card { --core: color-mix(in srgb, var(--acc) 42%, #fff); border-radius: 12px; background: linear-gradient(115deg, transparent 32%, #ffffff09 42%, transparent 52%), linear-gradient(180deg, #130b31f5, #0a0620f7);
      box-shadow: inset 0 0 0 1px var(--core), inset 0 0 0 2.5px var(--acc), inset 0 0 16px color-mix(in srgb, var(--acc) 30%, transparent), 0 0 0 1px color-mix(in srgb, var(--acc) 60%, transparent), 0 0 4px var(--acc); }
    body[data-theme="neon"] .chip { border-radius: 9px; background: #0c0720; color: var(--core); box-shadow: inset 0 0 0 1px var(--core), 0 0 0 1px var(--acc), 0 0 8px color-mix(in srgb, var(--acc) 70%, transparent); }
    body[data-theme="neon"] .chip svg { filter: drop-shadow(0 0 3px var(--acc)); }
    body[data-theme="neon"] .name { font-family: "Orbitron", sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--core); text-shadow: 0 0 2px var(--acc), 0 0 8px var(--acc); }
    body[data-theme="neon"] .value { font-family: "Rajdhani", "Saira SC", sans-serif; font-size: 20px; color: var(--core); text-shadow: 0 0 3px var(--acc), 0 0 12px var(--acc); }
    body[data-theme="neon"] .bar { background: #05020f; box-shadow: inset 0 0 0 1px #2c1f5c; -webkit-mask: repeating-linear-gradient(to right, #000 0 3px, transparent 3px 5px); mask: repeating-linear-gradient(to right, #000 0 3px, transparent 3px 5px); }
    body[data-theme="neon"] .card:not(.muted) .fill { background: linear-gradient(90deg, #19f0ff, #b46bff 55%, var(--acc)); }
    body[data-theme="neon"] .muted :is(.name, .value) { text-shadow: none; }
    body[data-theme="neon"] .muted .name { color: #c2b6e6; }
    body[data-theme="neon"] .muted .value { color: var(--red); }
    body[data-theme="glass"] .card { background: linear-gradient(160deg, #5a2bd8d0, #0a7fc4b0 65%, #8a1560b0); box-shadow: inset 0 1px 0 #ffffffd0, 0 0 0 1px #ffffff60, 0 0 24px #b18bff66; }
    body[data-theme="glass"] .value { text-shadow: 0 0 12px var(--acc); }
    body[data-theme="groovy"] .card { border-radius: 20px; box-shadow: inset 0 0 0 2px #e0a52699, 0 8px 16px #000a; }
    body[data-theme="groovy"] .value { color: #e0a526; }
    body[data-theme="transit"] .card { border-radius: 10px; box-shadow: inset 0 5px 0 var(--acc), 0 0 0 1px var(--line), 0 6px 14px rgba(30, 30, 25, .15); }
    body[data-theme="transit"] :is(.name, .value) { font-family: Bahnschrift, "Segoe UI", sans-serif; font-weight: 700; }
    body[data-theme="overclock"] .card { border-radius: 0; box-shadow: inset 3px 0 0 var(--acc), -2px 0 12px -4px var(--acc), 0 0 0 1px var(--line); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
    body[data-theme="overclock"] .value { color: var(--acc); text-shadow: 0 0 10px color-mix(in srgb, var(--acc) 55%, transparent); }
    body[data-theme="overclock"] :is(.name, .value) { font-family: "Rajdhani", "Saira SC", sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    body[data-theme="overclock"] .muted .value { color: var(--red); text-shadow: none; }
    body[data-theme="terminal"] :is(.name, .value) { text-shadow: 0 0 6px #3dff7a66; }
    body[data-theme="arcade"] .card { box-shadow: 0 0 0 3px #fff; }
    body[data-theme="arcade"] .value { color: #ffd400; text-shadow: 2px 2px 0 #ff3b3b; }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } .fill { transition: none; } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <span class="chip" id="chip"></span>
    <span class="name" id="name"></span>
    <span class="value" id="value"></span>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <script src="icons.js"></script>
  <script src="osd.js"></script>
</body>
</html>
